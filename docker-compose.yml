services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  python-producer:
    build: ./python-producer
    depends_on:
      rabbitmq:
        condition: service_healthy

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  nest-api:
    build: ./nest-api
    container_name: nest-api
    ports:
      - "3000:3000"
    env_file:
      - ./nest-api/.env
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  go-worker:
    build: ./go-worker
    container_name: go-worker
    env_file:
      - ./go-worker/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      nest-api:
        condition: service_healthy

volumes:
  mongo-data:
