version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # Porta AMQP (Python/Go usam essa)
      - "15672:15672" # Painel web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  python-producer:
    build: ./python-producer
    depends_on:
      - rabbitmq
